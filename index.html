<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多語種雲端遊戲化學習系統</title>
    
    <!-- FontAwesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- Firebase 設定檔 -->
    <script src="js/firebase-config.js"></script>

    <style>
        :root {
            --duo-green: #58cc02;
            --duo-green-shadow: #46a302;
            --duo-blue: #1cb0f6;
            --duo-blue-shadow: #1899d6;
            --duo-gray: #e5e7eb;
            --duo-red: #ff4b4b;
            --duo-red-shadow: #ea2b2b;
            --duo-gold: #f59e0b;
            --duo-lightning: #a5b4fc;
            --duo-fire-red: #ef4444;
        }

        body {
            margin: 0; padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f9fafb;
            -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            width: 100%; max-width: 600px; margin: 0 auto; min-height: 100vh;
            background: #ffffff; display: flex; flex-direction: column; position: relative;
            box-sizing: border-box;
        }

        /* 頂部資訊列 */
        .user-meta-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 14px; background: #ffffff; border-bottom: 2px solid #e5e7eb;
            font-size: 0.88rem; white-space: nowrap; position: relative; z-index: 100;
        }

        .user-meta-item {
            display: inline-flex; align-items: center; gap: 5px; font-weight: bold;
            color: #374151; cursor: pointer; padding: 6px 8px; border-radius: 10px;
            user-select: none; position: relative;
        }

        .btn-3d, .stage-btn-3d, .tab-btn {
            font-size: 0.9rem !important; font-weight: bold; border: none;
            border-radius: 16px; cursor: pointer; transition: all 0.1s ease;
            user-select: none; touch-action: manipulation;
        }
        
        .btn-3d-primary { background: var(--duo-green); color: white; box-shadow: 0 4px 0 var(--duo-green-shadow); }
        .btn-3d-primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--duo-green-shadow); }
        .btn-3d-secondary { background: #ffffff; color: #4b5563; border: 2px solid #e5e7eb; box-shadow: 0 4px 0 #e5e7eb; }
        .btn-3d-secondary:active { transform: translateY(2px); box-shadow: 0 1px 0 #e5e7eb; }

        .btn-google {
            background: #ffffff; color: #374151; border: 2px solid #e5e7eb;
            box-shadow: 0 4px 0 #e5e7eb; display: flex; align-items: center;
            justify-content: center; gap: 10px; width: 100%; padding: 12px;
            font-size: 1rem; font-weight: bold; border-radius: 16px; cursor: pointer;
        }

        .map-container { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 15px; width: 100%; box-sizing: border-box; }
        .unit-card { width: 100%; background: #ffffff; border: 2px solid #e5e7eb; border-radius: 20px; padding: 16px; box-shadow: 0 4px 0 #f3f4f6; box-sizing: border-box; }

        .custom-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .custom-modal-card { background: white; border-radius: 24px; padding: 24px 20px; width: 85%; max-width: 380px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.25); position: relative; box-sizing: border-box; }

        .close-icon-circle { position: absolute; top: 14px; left: 16px; width: 28px; height: 28px; background: #f3f4f6; color: #9ca3af; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; cursor: pointer; }

        .tab-btn { flex: 1; padding: 10px; border: none; background: #ffffff; color: #6b7280; border-radius: 12px; cursor: pointer; border: 1px solid #e5e7eb; }
        .tab-btn.active { background: var(--duo-blue); color: white; border-color: var(--duo-blue); box-shadow: 0 3px 0 var(--duo-blue-shadow); }

        .nav-tab-btn { padding: 6px 12px; border: 2px solid #e5e7eb; background: #f9fafb; color: #6b7280; border-radius: 12px; font-size: 0.85rem; font-weight: bold; cursor: pointer; }
        .nav-tab-btn.active { background: var(--duo-blue); color: white; border-color: var(--duo-blue-shadow); }

        .rank-card-box { background: #f9fafb; border: 2px solid #e5e7eb; border-radius: 16px; padding: 16px; margin-top: 12px; }

        .profile-avatar-large { width: 72px; height: 72px; border-radius: 50%; border: 3px solid var(--duo-blue); margin: 0 auto 10px auto; object-fit: cover; }
        
        /* 課程開通氣泡膠囊樣式 */
        .course-badge-pill { 
            display: block; 
            padding: 10px 14px; 
            border-radius: 16px; 
            font-size: 0.9rem; 
            font-weight: bold; 
            background: #e0f2fe; 
            color: #0284c7; 
            border: 1.5px solid #bae6fd; 
            text-align: center;
        }

        /* 打卡月曆 Dashboard CSS */
        .calendar-header-ctrl { display: flex; justify-space-between; align-items: center; margin-bottom: 10px; font-weight: bold; color: #374151; font-size: 0.9rem; }
        .calendar-nav-btn { background: #f3f4f6; border: none; border-radius: 8px; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: #4b5563; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; text-align: center; }
        .calendar-day-header { font-size: 0.75rem; color: #9ca3af; font-weight: bold; padding-bottom: 4px; }
        .calendar-day { font-size: 0.85rem; padding: 8px 0; border-radius: 10px; background: #f9fafb; border: 1px solid #f3f4f6; color: #4b5563; }
        .calendar-day.empty { background: transparent; border: none; }
        .calendar-day.checked { background: #dcfce7; color: #15803d; font-weight: bold; border-color: #86efac; }

        .hidden { display: none !important; }
        input, select { width: 100%; padding: 10px 12px; margin: 6px 0; border-radius: 12px; border: 2px solid #e5e7eb; box-sizing: border-box; font-size: 0.95rem; }
    </style>
</head>
<body>

    <!-- 🔑 1. Google 登入視窗 -->
    <div class="custom-modal hidden" id="login-modal">
        <div class="custom-modal-card">
            <div style="font-size: 2.5rem; color: var(--duo-blue); margin-bottom: 10px;"><i class="fa-solid fa-graduation-cap"></i></div>
            <h3 style="margin: 0 0 8px 0;">歡迎來到多語種大冒險</h3>
            <p style="font-size: 0.85rem; color:#6b7280; margin-bottom: 20px;">請使用已被系統開通的 Google 帳號登入</p>
            
            <button class="btn-google" id="btn-google-login">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" height="20" alt="Google">
                使用 Google 帳號登入
            </button>
        </div>
    </div>

    <!-- 🔥 打卡月曆 Dashboard Modal (已恢復) -->
    <div id="modal-streak-dashboard" class="custom-modal hidden">
        <div class="custom-modal-card">
            <div class="close-icon-circle" id="btn-close-streak-modal"><i class="fa-solid fa-xmark"></i></div>
            <h3 style="margin: 5px 0 15px 0; color: #1f2937;"><i class="fa-solid fa-fire" style="color: var(--duo-fire-red);"></i> 學習成就統計</h3>
            
            <div style="display: flex; justify-content: space-around; background: #f9fafb; padding: 12px; border-radius: 16px; margin-bottom: 15px; border: 1px solid #e5e7eb;">
                <div>
                    <div style="font-size: 0.75rem; color: #6b7280;">打卡天數</div>
                    <div style="font-size: 1.2rem; font-weight: bold; color: var(--duo-fire-red);"><span id="dash-streak-days">2</span> 天</div>
                </div>
                <div style="border-left: 1px solid #e5e7eb;"></div>
                <div>
                    <div style="font-size: 0.75rem; color: #6b7280;">專注時數</div>
                    <div style="font-size: 1.2rem; font-weight: bold; color: var(--duo-blue);"><span id="dash-focus-hours">0.0</span> 小時</div>
                </div>
            </div>

            <div class="calendar-header-ctrl">
                <div><i class="fa-regular fa-calendar-days" style="color: var(--duo-gold);"></i> 簽到紀錄</div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <button class="calendar-nav-btn" id="btn-cal-prev"><i class="fa-solid fa-chevron-left"></i></button>
                    <span id="lbl-calendar-month-title">2026年 9月</span>
                    <button class="calendar-nav-btn" id="btn-cal-next"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>

            <div class="calendar-grid">
                <div class="calendar-day-header">日</div><div class="calendar-day-header">一</div><div class="calendar-day-header">二</div><div class="calendar-day-header">三</div><div class="calendar-day-header">四</div><div class="calendar-day-header">五</div><div class="calendar-day-header">六</div>
                <div id="calendar-days-container" style="display: contents;"></div>
            </div>
        </div>
    </div>

    <!-- 登出確認 Modal -->
    <div id="modal-logout-confirm" class="custom-modal hidden">
        <div class="custom-modal-card">
            <h3 style="margin: 0 0 10px 0; color: #1f2937;">確定要登出嗎？</h3>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button id="btn-logout-yes" class="btn-3d" style="flex: 1; padding: 10px; background: var(--duo-red); color: white; box-shadow: 0 4px 0 var(--duo-red-shadow);">登出</button>
                <button id="btn-logout-no" class="btn-3d btn-3d-secondary" style="flex: 1; padding: 10px;">取消</button>
            </div>
        </div>
    </div>

    <!-- 主應用容器 -->
    <div class="app-container" id="main-app">
        
        <!-- 首頁頂端資訊列 -->
        <div class="user-meta-bar">
            <div class="user-meta-item" id="btn-profile-trigger">
                <i class="fa-solid fa-user" style="color: var(--duo-blue); font-size: 1.05rem;"></i>
                <span id="lbl-username">wei</span>
            </div>

            <!-- 連續登入天數 (點擊開啟打卡統計) -->
            <div class="user-meta-item" id="btn-streak-trigger">
                <i class="fa-solid fa-fire" style="color: var(--duo-fire-red); font-size: 1.05rem;"></i>
                <span id="lbl-login-days">2</span> 天
            </div>

            <div class="user-meta-item">
                <i class="fa-solid fa-star" style="color: var(--duo-gold); font-size: 1.05rem;"></i>
                <span id="lbl-xp">0</span>
            </div>

            <div class="user-meta-item">
                <i class="fa-solid fa-bolt-lightning" style="color: var(--duo-lightning); font-size: 1.05rem;"></i>
                <span id="lbl-energy">100</span>
            </div>

            <div class="user-meta-item" id="btn-level-trigger">
                <span id="lbl-user-level" style="color: var(--duo-blue);">1A</span>
                <i class="fa-solid fa-caret-down" style="font-size: 0.75rem; color: #9ca3af;"></i>
            </div>
        </div>

        <!-- 地圖 View -->
        <div id="map-view" class="map-container">
            <!-- 快捷按鈕區 (恢復排行榜與我的帳號) -->
            <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px;">
                <button id="btn-back-to-map" class="btn-3d btn-3d-secondary" style="padding: 6px 14px;">
                    <i class="fa-solid fa-arrow-left"></i> 返回地圖
                </button>
                <div style="display: flex; gap: 8px;">
                    <button id="btn-map-leaderboard" class="btn-3d btn-3d-secondary" style="padding: 6px 14px;">
                        <i class="fa-solid fa-trophy" style="color: var(--duo-gold);"></i> 排行榜
                    </button>
                    <button id="btn-map-my-account" class="btn-3d btn-3d-primary" style="padding: 6px 14px;">
                        <i class="fa-solid fa-id-card"></i> 我的帳號
                    </button>
                </div>
            </div>

            <div id="units-map-list" style="width: 100%;"></div>
        </div>

        <!-- 視圖 2：排行榜與 Profile 會員詳細資料頁 -->
        <div id="profile-view" class="hidden" style="padding: 15px; width: 100%; box-sizing: border-box;">
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <button id="btn-profile-back-map" class="btn-3d btn-3d-secondary" style="padding: 6px 14px;">
                    <i class="fa-solid fa-arrow-left"></i> 返回地圖
                </button>

                <div style="display: flex; gap: 6px;">
                    <button class="nav-tab-btn active" id="btn-view-leaderboard">
                        <i class="fa-solid fa-trophy"></i> 排行榜
                    </button>
                    <button class="nav-tab-btn" id="btn-view-profile">
                        <i class="fa-solid fa-id-card"></i> 我的帳號
                    </button>
                </div>
            </div>

            <!-- 分頁 A：學習排行榜 (已恢復) -->
            <div id="sub-page-leaderboard" class="unit-card">
                <h3 style="margin-top:0; color: #1f2937; border-bottom: 2px solid #f3f4f6; padding-bottom: 10px;">
                    <i class="fa-solid fa-trophy" style="color: var(--duo-gold);"></i> 學習排行榜
                </h3>
                
                <div style="display: flex; gap: 8px; margin-bottom: 12px; background: #f3f4f6; padding: 6px; border-radius: 14px;">
                    <button class="tab-btn active" id="tab-leaderboard-friends">好友榜</button>
                    <button class="tab-btn" id="tab-leaderboard-global">全球總榜</button>
                </div>

                <div id="content-rank-friends" class="rank-card-box">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
                        <span style="font-weight:bold; color:#374151;">我的好友列表</span>
                        <button class="btn-3d btn-3d-primary" style="padding: 6px 12px; font-size: 0.8rem !important;">
                            <i class="fa-solid fa-user-plus"></i> 新增好友
                        </button>
                    </div>
                    <div id="friends-list-container" style="text-align:center; padding: 20px 0; color: #9ca3af; font-size: 0.9rem;">
                        目前還沒有好友，快去新增吧！
                    </div>
                </div>

                <div id="content-rank-global" class="rank-card-box hidden" style="text-align: center; padding: 20px 0;">
                    <p style="font-size: 0.9rem; color: #6b7280; margin: 0;">🏆 全球排行榜載入中...</p>
                </div>
            </div>

            <!-- 分頁 B：Profile 會員資料與已開通課程 (已恢復) -->
            <div id="sub-page-profile" class="unit-card hidden">
                <div style="text-align: center; border-bottom: 2px solid #f3f4f6; padding-bottom: 15px;">
                    <img id="profile-user-avatar" src="https://avatar.iran.liara.run/public/boy?username=wei" class="profile-avatar-large" alt="User Avatar">
                    <h3 style="margin: 0; color: #1f2937;"><span id="profile-nickname">wei</span></h3>
                    <p style="font-size: 0.82rem; color: #6b7280; margin: 4px 0 0 0;" id="profile-email">bleach7981@gmail.com</p>
                </div>

                <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 15px;">
                    <!-- 已開通課程與到期日列表 (已恢復) -->
                    <div>
                        <span style="font-size: 0.88rem; font-weight: bold; color: #374151; display: block; margin-bottom: 8px;">已開通課程與到期日：</span>
                        <div id="profile-memberships-list" style="display:flex; flex-direction:column; gap:8px;">
                            <!-- JS 自動繪製開通膠囊 -->
                        </div>
                    </div>

                    <hr style="border: none; border-top: 1px dashed #e5e7eb; margin: 4px 0;">

                    <div style="display:flex; justify-content: space-between; font-size: 0.9rem;">
                        <span style="color: #6b7280;">剩餘能量：</span>
                        <span style="color: var(--duo-blue); font-weight: bold;"><i class="fa-solid fa-bolt-lightning"></i> <span id="profile-energy">100</span></span>
                    </div>
                    <div style="display:flex; justify-content: space-between; font-size: 0.9rem;">
                        <span style="color: #6b7280;">累積經驗 (XP)：</span>
                        <span style="color: var(--duo-gold); font-weight: bold;"><i class="fa-solid fa-star"></i> <span id="profile-xp">0</span></span>
                    </div>
                    <div style="display:flex; justify-content: space-between; font-size: 0.9rem;">
                        <span style="color: #6b7280;">連續簽到：</span>
                        <span style="color: var(--duo-fire-red); font-weight: bold;"><i class="fa-solid fa-fire"></i> <span id="profile-streak">2</span> 天</span>
                    </div>
                </div>

                <div style="margin-top: 25px;">
                    <button id="btn-trigger-logout" class="btn-3d" style="width: 100%; padding: 12px; background: var(--duo-red); color: white; box-shadow: 0 4px 0 var(--duo-red-shadow);">
                        <i class="fa-solid fa-right-from-bracket"></i> 登出系統
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script type="module" src="./src/app.js"></script>
</body>
</html>
