<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多語種學習系統 & 韓語句子極限挑戰賽</title>
  <style>
    /* 基礎與 3D Duolingo 風格樣式 */
    :root {
      --primary-color: #58cc02;
      --primary-shadow: #46a302;
      --secondary-color: #1cb0f6;
      --secondary-shadow: #1899d6;
      --bg-color: #f7f9fa;
      --text-color: #3c3c3c;
    }

    body {
      font-family: 'Din Round', 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
    }

    .app-layout {
      display: flex;
      min-height: 100vh;
    }

    /* 導覽列 */
    .sidebar {
      width: 240px;
      background-color: #fff;
      border-right: 2px solid #e5e5e5;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 3D 按鈕樣式 */
    .btn-3d {
      border: none;
      border-radius: 16px;
      padding: 12px 20px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.1s ease;
      position: relative;
      text-align: center;
      text-decoration: none;
      display: inline-block;
    }

    .btn-3d-primary {
      background-color: var(--primary-color);
      color: white;
      box-shadow: 0 4px 0 var(--primary-shadow);
    }
    .btn-3d-primary:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 var(--primary-shadow);
    }

    .btn-3d-nav {
      background-color: #fff;
      color: #777;
      border: 2px solid #e5e5e5;
      box-shadow: 0 4px 0 #e5e5e5;
    }
    .btn-3d-nav.active {
      color: var(--secondary-color);
      border-color: var(--secondary-color);
      box-shadow: 0 4px 0 var(--secondary-shadow);
    }
    .btn-3d-nav:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #e5e5e5;
    }

    /* 主內容區 */
    .main-content {
      flex: 1;
      padding: 30px;
      max-width: 900px;
    }

    .view-section {
      display: block;
    }
    .hidden {
      display: none !important;
    }

    /* 3D 卡片容器 */
    .card-3d {
      background: white;
      border: 2px solid #e5e5e5;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 6px 0 #e5e5e5;
      margin-bottom: 24px;
    }

    /* 挑戰賽表格樣式 */
    .styled-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }

    .styled-table th, .styled-table td {
      padding: 12px 16px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }

    .styled-table th {
      background-color: #f8f9fa;
      color: #555;
      font-weight: bold;
    }

    .gold { background-color: #fff9db; }
    .silver { background-color: #f1f3f5; }
    .bronze { background-color: #fff0f6; }

    .btn-link {
      color: var(--secondary-color);
      font-weight: bold;
      text-decoration: none;
    }
    .btn-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <!-- 側邊導覽列 -->
    <nav class="sidebar">
      <h2 style="color: var(--primary-color); margin-bottom: 20px;">多語學習 App</h2>
      <button class="btn-3d btn-3d-nav active" id="nav-map" onclick="switchView('map-view')">🗺️ 學習地圖</button>
      <button class="btn-3d btn-3d-nav" id="nav-challenge" onclick="switchView('challenge-view')">🏆 極限挑戰賽</button>
      <button class="btn-3d btn-3d-nav" id="nav-profile" onclick="switchView('profile-view')">👤 個人中心</button>
    </nav>

    <!-- 主內容區劃分 -->
    <main class="main-content">

      <!-- View 1: 學習地圖 (原本的學習關卡) -->
      <section id="map-view" class="view-section">
        <div class="card-3d">
          <h2>📚 韓語課程學習地圖</h2>
          <p>選擇關卡開始學習吧！</p>
          <button class="btn-3d btn-3d-primary" onclick="alert('進入學習單元！')">開始第 1 單元</button>
        </div>
      </section>

      <!-- View 2: 🏆 韓語句子極限挑戰賽 -->
      <section id="challenge-view" class="view-section hidden">
        <div style="text-align: center; margin-bottom: 24px;">
          <h2 style="font-size: 28px; margin-bottom: 8px;">🏆 韓語句子極限挑戰賽</h2>
          <p style="color: #666;">解鎖句子跟讀、填空與聽打，刷新你的最高分紀錄！</p>
        </div>

        <!-- 挑戰賽排行榜 -->
        <div class="card-3d">
          <h3 style="margin-top: 0;">🥇 挑戰賽排行榜</h3>
          <div id="challenge-leaderboard">
            <p style="color: gray;">載入排行榜中...</p>
          </div>
        </div>

        <!-- 17 單元關卡列表 -->
        <div class="card-3d">
          <h3 style="margin-top: 0;">📚 17 單元挑戰關卡</h3>
          <div id="challenge-units-container" style="overflow-x: auto;">
            <p style="color: gray;">載入單元列表中...</p>
          </div>
        </div>
      </section>

      <!-- View 3: 個人中心 -->
      <section id="profile-view" class="view-section hidden">
        <div class="card-3d">
          <h2>👤 個人資料</h2>
          <p>暱稱：<span id="user-display-name">使用者</span></p>
        </div>
      </section>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
