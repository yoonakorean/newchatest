<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多語種學習系統</title>
  <style>
    :root {
      --primary-color: #58cc02;
      --secondary-color: #1cb0f6;
      --bg-color: #f7f9fa;
      --card-bg: #ffffff;
      --border-color: #e5e5e5;
      --text-color: #3c3c3c;
    }

    body {
      font-family: 'Din Round', 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
    }

    .app-header {
      background: white;
      border-bottom: 2px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-container {
      display: flex;
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 16px;
      gap: 20px;
    }

    .main-content {
      flex: 1;
    }

    .level-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .btn-3d {
      border: none;
      border-radius: 12px;
      padding: 10px 18px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.1s ease;
      position: relative;
    }

    .btn-level {
      background-color: #fff;
      color: #777;
      border: 2px solid var(--border-color);
      box-shadow: 0 3px 0 var(--border-color);
    }

    .btn-level.active {
      background-color: var(--secondary-color);
      color: white;
      border-color: var(--secondary-color);
      box-shadow: 0 3px 0 #1899d6;
    }

    .btn-3d:active {
      transform: translateY(3px);
      box-shadow: 0 0 0 transparent !important;
    }

    .card-3d {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 0 var(--border-color);
      margin-bottom: 20px;
    }

    .level-view {
      display: none;
    }

    .level-view.active {
      display: block;
    }

    /* 挑戰賽表格通用樣式 */
    .styled-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      text-align: center;
    }

    .styled-table th, .styled-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .styled-table th {
      background-color: #f8f9fa;
      color: #555;
    }

    .btn-link {
      color: var(--secondary-color);
      font-weight: bold;
      text-decoration: none;
    }

    .btn-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <h2 style="margin:0; color: var(--primary-color);">Duolingo 風格韓語學習系統</h2>
    <div id="auth-status">
      <span id="user-display-name">載入使用者中...</span>
    </div>
  </header>

  <div class="app-container">
    <main class="main-content">

      <!-- 程度切換選單 -->
      <div class="level-selector">
        <button class="btn-3d btn-level" onclick="switchLevel('0A')">0A 基礎</button>
        <button class="btn-3d btn-level active" onclick="switchLevel('1A')">1A 初級</button>
        <button class="btn-3d btn-level" onclick="switchLevel('1B')">1B 初級</button>
        <button class="btn-3d btn-level" onclick="switchLevel('2A')">2A 中級</button>
        <button class="btn-3d btn-level" onclick="switchLevel('2B')">2B 中級</button>
      </div>

      <!-- 0A 程度頁面 -->
      <div id="level-view-0A" class="level-view">
        <div class="card-3d">
          <h3>📚 0A 韓語字母與基礎發音</h3>
          <p>這裡包含子音、母音與收音基礎練習關卡。</p>
        </div>
      </div>

      <!-- 1A 程度頁面 -->
      <div id="level-view-1A" class="level-view active">
        <div class="card-3d">
          <h3>📚 1A 課程學習地圖</h3>
          <p>完成基礎語法與句型關卡。</p>
        </div>

        <!-- 🏆 1A 極限挑戰賽 (HTML 排版容器) -->
        <div class="card-3d" style="border: 2px solid #1cb0f6;">
          <h3 style="color: #1cb0f6; margin-top: 0;">🏆 1A 韓語句子極限挑戰賽</h3>
          
          <!-- 排行榜容器 -->
          <div style="margin-bottom: 20px;">
            <h4 style="margin: 8px 0; color: #555;">🥇 挑戰賽排行榜前三名</h4>
            <div id="leaderboard-1A">
              <p style="color: gray; text-align: center;">載入排行榜中...</p>
            </div>
          </div>

          <!-- 關卡與成績表格容器 -->
          <div>
            <h4 style="margin: 8px 0; color: #555;">📚 17 單元挑戰關卡 (SS跟讀 / SF填空 / ST聽打)</h4>
            <div id="units-table-1A" style="overflow-x: auto;">
              <p style="color: gray; text-align: center;">載入關卡中...</p>
            </div>
          </div>
        </div>
      </div>

      <!-- 1B 程度頁面 -->
      <div id="level-view-1B" class="level-view">
        <div class="card-3d">
          <h3>📚 1B 課程學習地圖</h3>
          <p>1B 課程關卡內容。</p>
        </div>
      </div>

      <!-- 2A 程度頁面 -->
      <div id="level-view-2A" class="level-view">
        <div class="card-3d">
          <h3>📚 2A 課程學習地圖</h3>
          <p>2A 中級課程內容。</p>
        </div>
      </div>

      <!-- 2B 程度頁面 -->
      <div id="level-view-2B" class="level-view">
        <div class="card-3d">
          <h3>📚 2B 課程學習地圖</h3>
          <p>2B 中級課程內容。</p>
        </div>
      </div>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
